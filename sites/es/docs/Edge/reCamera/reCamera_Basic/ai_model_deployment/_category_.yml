  title: Descripción general del despliegue de modelos de IA
  description: Esta sección ofrece una descripción general concisa de los procesos de entrenamiento, ajuste fino y despliegue de modelos de IA para reCamera. Comienza con la selección del modelo, analizando opciones como YOLO v5/v8/11 y los criterios para elegir el modelo adecuado según distintos escenarios, junto con los modelos típicos actuales y los frameworks disponibles. Luego aborda la configuración de parámetros, seguida de los complejos procedimientos de conversión de formato de modelo, que implican la adaptación del modelo y la traducción del middleware. Posteriormente, cubre la cuantización y compresión del modelo. Finalmente, trata las fases de despliegue y prueba, incluidas las consideraciones sobre el posprocesamiento.